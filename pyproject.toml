[project]
name = "gujnorm"
version = "0.1.1"
description = "Gujarati text normalizer for TTS: times, money, fractions, dates, ranges, ordinals, IDs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
sarvam = ["sarvamai"]
dev = ["pytest", "sarvamai", "python-dotenv"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gujnorm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
